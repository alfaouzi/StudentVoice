name: Build Android Release (AAB & APK)

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Build Release AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Release Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
          elif [ -f "${{ github.workspace }}/my-upload-key.jks" ]; then
            echo "Using existing my-upload-key.jks in workspace..."
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
          else
            echo "::notice::Release keystore not found in secrets (KEYSTORE_BASE64/RELEASE_KEYSTORE_BASE64) or at my-upload-key.jks. If the build requires signing, configure KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in repository secrets."
          fi

      - name: Build Release Bundle (AAB)
        run: ./gradlew :app:bundleRelease
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentVoice-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentVoice-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
